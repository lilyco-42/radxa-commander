name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.1.0'
      - name: Build APK
        working-directory: android
        env:
          # 版本号跟 tag 走（v0.2.1 -> versionName 0.2.1 / versionCode 201）
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.2.1' }}
          # 发版必须有稳定签名密钥。没有就直接失败 —— 用临时密钥签出来的包
          # 盖不上旧版（INSTALL_FAILED_UPDATE_INCOMPATIBLE），发出去等于给用户埋坑。
          REQUIRE_RELEASE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
          # ⚠️ 这四行必须有。build-apk.sh 读的是环境变量；Secrets 不显式映射到 env
          # 就等于没配 —— 发版时 REQUIRE_RELEASE_KEY=1 直接失败（曾经踩过）。
          # 所有构建（含 main）都用这把固定密钥，签名才能长期一致。
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: bash build-apk.sh
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: commander-apk
          path: android/build/commander.apk
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/commander.apk
          generate_release_notes: true
          # body 会被 prepend 到自动生成的 changelog 前面。
          # 这段是给「只会下载 apk 的人」看的 —— 他看不到 README，
          # 撞上 INSTALL_FAILED_UPDATE_INCOMPATIBLE 也不知道为什么。
          body: |
            ### 安装

            1. 下载下面的 `commander.apk`
            2. 手机上点开安装（需要允许「安装未知来源应用」）
            3. 打开 App，填 **板子 IP** 和 **token**：
               - IP：手机直连板子的 AP 时是 `10.42.0.1`；同一个局域网时填板子的局域网地址
               - token：在板子上执行 `cat ~/commander-token.txt`（免 sudo）
                 取不到就 `sudo cat /etc/radxa-commander/token`
            4. token 不对时 App 会把该执行的命令直接写在错误提示里，照抄即可

            ### ⚠️ 从 v0.2.0 或更早版本升级：必须先卸载一次

            以前每次 CI 都用临时密钥现场签名，所以 v0.1.0 / v0.2.0 / v0.2.1 三个包的
            签名各不相同，Android 会拒绝覆盖安装（`INSTALL_FAILED_UPDATE_INCOMPATIBLE`）。

            **从 v0.2.1 起签名已固定**，以后可以正常覆盖升级，不会再有这一步。
            卸载会清掉 App 里存的 token，重装后重新粘贴一次即可（板子上的 token 不变）。

            本版签名指纹（以后每个版本都应是这一串）：

            ```
            SHA-256 60:D5:7C:8D:5C:68:57:3F:FA:F7:20:84:DB:DD:DB:2F:7D:08:E4:CA:19:96:98:C3:3D:6A:C2:0F:3A:63:C7:32
            ```

            ---
